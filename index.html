<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CAMS Study">
<meta name="theme-color" content="#06090F">
<title>CAMS StudyApp</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2300C9A7'/><text y='72' x='50' text-anchor='middle' font-size='62' font-weight='900' font-family='system-ui' fill='%23000'>C</text></svg>">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#06090F;overscroll-behavior:none;}
  body{font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;color:#E2E8F4;overflow:hidden;}
  #app{height:100dvh;display:flex;flex-direction:column;max-width:600px;margin:0 auto;}
  /* header */
  #hdr{background:linear-gradient(135deg,#0D1520 0%,#080d18 100%);border-bottom:1px solid #162035;padding:env(safe-area-inset-top,0) 16px 0;flex-shrink:0;}
  #hdr-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 0;}
  .logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#00C9A7,#3B82F6);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#06090F;flex-shrink:0;}
  .logo-text{font-size:13px;font-weight:800;background:linear-gradient(90deg,#00C9A7,#3B82F6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .logo-sub{font-size:9px;color:#2D3F55;}
  .stat-pills{display:flex;gap:5px;}
  .pill{background:#0D1520;border:1px solid #162035;border-radius:14px;padding:3px 8px;font-size:11px;display:flex;align-items:center;gap:3px;}
  /* nav */
  #nav{display:flex;background:#0D1520;border-top:1px solid #162035;padding:0 0 env(safe-area-inset-bottom,0);flex-shrink:0;}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border:none;background:transparent;cursor:pointer;font-family:inherit;gap:3px;min-height:52px;}
  .nav-icon{font-size:20px;}
  .nav-label{font-size:9px;font-weight:600;color:#64748B;}
  .nav-btn.active .nav-label{color:#00C9A7;}
  .nav-btn.active .nav-icon{filter:drop-shadow(0 0 4px #00C9A7);}
  /* scroll area */
  #content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px;}
  /* cards */
  .card{background:#0D1520;border:1px solid #162035;border-radius:14px;padding:16px;margin-bottom:12px;}
  .card.accent{border-color:#00C9A7;}
  .card.danger{border-color:#F43F5E;}
  /* buttons */
  .btn-primary{background:linear-gradient(135deg,#00C9A7,#009d80);color:#06090F;border:none;border-radius:11px;padding:13px 24px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;width:100%;-webkit-appearance:none;}
  .btn-sec{background:transparent;color:#64748B;border:1px solid #162035;border-radius:10px;padding:9px 16px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;-webkit-appearance:none;}
  .btn-sec.active{background:#00c9a718;border-color:#00C9A7;color:#00C9A7;}
  /* tags */
  .tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase;}
  .tag-blue{background:#3b82f618;color:#3B82F6;}
  .tag-green{background:#00c9a718;color:#00C9A7;}
  .tag-gold{background:#f59e0b18;color:#F59E0B;}
  .tag-pur{background:#8b5cf618;color:#8B5CF6;}
  /* option buttons */
  .opt{display:block;width:100%;border-radius:10px;padding:12px 14px;font-size:13px;border:1px solid #162035;background:#0D1520;color:#E2E8F4;text-align:left;cursor:pointer;font-family:inherit;line-height:1.6;margin-bottom:6px;-webkit-appearance:none;}
  .opt.selected{background:#00c9a718;border-color:#00C9A7;color:#00C9A7;}
  .opt.correct{background:#00c9a718;border-color:#00C9A7;color:#00C9A7;}
  .opt.wrong{background:#f43f5e18;border-color:#F43F5E;color:#F43F5E;}
  /* progress */
  .pbar{height:5px;background:#162035;border-radius:3px;overflow:hidden;}
  .pbar-fill{height:100%;border-radius:3px;transition:width .3s;}
  /* stats grid */
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
  .stat-box{background:#0D1520;border:1px solid #162035;border-radius:12px;padding:14px;text-align:center;}
  .stat-val{font-size:28px;font-weight:900;}
  .stat-lbl{font-size:11px;color:#64748B;margin-top:3px;}
  /* filter row */
  .filter-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
  .filter-scroll::-webkit-scrollbar{display:none;}
  /* section title */
  .sec-title{font-size:18px;font-weight:800;margin-bottom:4px;}
  .sec-sub{font-size:12px;color:#64748B;margin-bottom:14px;}
  /* toast */
  #toast{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:#1a2840;border:1px solid #00C9A7;border-radius:10px;padding:10px 18px;font-size:13px;color:#00C9A7;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:999;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  /* exam timer */
  .timer{background:#0D1520;border:1px solid #162035;border-radius:18px;padding:4px 10px;font-size:14px;font-weight:800;}
  .timer.urgent{border-color:#F43F5E;color:#F43F5E;}
  h2{font-size:19px;font-weight:800;}
</style>
</head>
<body>
<div id="app">
  <div id="hdr"><div id="hdr-inner">
    <div style="display:flex;align-items:center;gap:8px">
      <div class="logo-icon">C</div>
      <div><div class="logo-text">CAMS StudyApp</div><div class="logo-sub">スタディガイド v6.52 · 164問</div></div>
    </div>
    <div class="stat-pills">
      <div class="pill"><span style="color:#00C9A7">✓</span><span id="hdr-correct">0</span></div>
      <div class="pill"><span style="color:#F43F5E">✗</span><span id="hdr-wrong">0</span></div>
      <div class="pill" style="color:#F59E0B">🏆<span id="hdr-pct">0%</span></div>
    </div>
  </div></div>
  <div id="content"></div>
  <nav id="nav">
    <button class="nav-btn active" onclick="showTab('practice')" id="tab-practice"><span class="nav-icon">🎯</span><span class="nav-label">一問一答</span></button>
    <button class="nav-btn" onclick="showTab('exam')" id="tab-exam"><span class="nav-icon">📋</span><span class="nav-label">模擬試験</span></button>
    <button class="nav-btn" onclick="showTab('topics')" id="tab-topics"><span class="nav-icon">📚</span><span class="nav-label">トピック</span></button>
    <button class="nav-btn" onclick="showTab('stats')" id="tab-stats"><span class="nav-icon">📊</span><span class="nav-label">統計</span></button>
  </nav>
</div>
<div id="toast"></div>

<script>
'use strict';

// ═══════════════════════════════════════
// QUESTION BANK
// ═══════════════════════════════════════
const QUESTION_BANK = [

// ══════════════════════════════════════════════
// CHAPTER 1-A: MLの定義・3段階・経済的影響
// ══════════════════════════════════════════════
{
  id:"1a-01", topic:"MLの定義と段階", difficulty:"基本",
  question:"パレルモ条約（国際組織犯罪防止条約）におけるマネー・ローンダリングの定義に含まれる3つの行為として正しい組み合わせはどれですか？",
  options:["A. 移転・隠蔽・破棄", "B. 移転・隠蔽・獲得", "C. 調達・移動・使用", "D. プレイスメント・レイヤリング・インテグレーション"],
  answer:1, explanation:"パレルモ条約は①移転（不正な出所を隠蔽する目的で資産を転換・移転）②隠蔽（資産の性質・源泉・場所・処分・移動・権利または所有権を隠蔽・偽装）③獲得（犯罪行為から発生したことを知りながら資産を取得・保有・使用）の3行為を定義する。"
},
{
  id:"1a-02", topic:"MLの定義と段階", difficulty:"基本",
  question:"マネー・ローンダリングの定義において最も重要な前提要素はどれですか？",
  options:["A. 金額の大きさ", "B. 認識（知っていること）", "C. 犯罪の種類", "D. 資産の形態"],
  answer:1, explanation:"MLの定義における重要な前提要素は「認識（知っていること）」。3つの定義すべてに「犯罪行為から発生したことを知りながら」というフレーズが含まれ、意図的な無関心（willful blindness）もこれに相当する。"
},
{
  id:"1a-03", topic:"MLの定義と段階", difficulty:"基本",
  question:"マネー・ローンダリングの3段階を正しい順序で示しているのはどれですか？",
  options:["A. レイヤリング→プレイスメント→インテグレーション", "B. インテグレーション→プレイスメント→レイヤリング", "C. プレイスメント→レイヤリング→インテグレーション", "D. プレイスメント→インテグレーション→レイヤリング"],
  answer:2, explanation:"プレイスメント（不正資金を金融システムに取り込む）→レイヤリング（複雑な取引で資金の追跡を困難にする）→インテグレーション（洗浄した資金を実態経済に戻す）の順序が正しい。"
},
{
  id:"1a-04", topic:"MLの定義と段階", difficulty:"応用",
  question:"麻薬密売人が犯罪収益の現金をカジノでチップに換えた場合、マネー・ローンダリングのどの段階に当たりますか？",
  options:["A. レイヤリング", "B. インテグレーション", "C. プレイスメント", "D. ストラクチャリング"],
  answer:2, explanation:"現金を金融システム（またはカジノ）に初めて取り込む行為はプレイスメント。プレイスメントは犯罪収益が最初に洗浄プロセスに入る段階で、最も発覚しやすい。"
},
{
  id:"1a-05", topic:"MLの定義と段階", difficulty:"応用",
  question:"洗浄業者が複数の国際電信送金を繰り返し行い、資金の出所を追跡困難にしている場合、どの段階に当たりますか？",
  options:["A. プレイスメント", "B. インテグレーション", "C. ストラクチャリング", "D. レイヤリング"],
  answer:3, explanation:"レイヤリングは複雑な金融取引を重ねることで監査証跡・資金の出所・所有者を偽装する段階。電子的資金移動（EFT）がよく使われ、複数口座・銀行・国間を移動させることで追跡を困難にする。"
},
{
  id:"1a-06", topic:"MLの定義と段階", difficulty:"応用",
  question:"不動産の購入が、洗浄済み資金を通常の経済活動に組み込む手段として使われている場合、どの段階の典型的な手法ですか？",
  options:["A. プレイスメント", "B. レイヤリング", "C. インテグレーション", "D. プレイスメントとレイヤリングの両方"],
  answer:2, explanation:"不動産購入を通じて洗浄済み資金を正当な経済活動に戻す行為はインテグレーション。ただし不動産は3つの段階すべてに使用できる点に注意。"
},
{
  id:"1a-07", topic:"経済的・社会的影響", difficulty:"基本",
  question:"マネー・ローンダリングが国の経済に与える影響として、スタディガイドが指摘しているものはどれですか？（3つ選択）",
  options:["A. 金融機関の脆弱化", "B. 犯罪と汚職の増加", "C. 税収増加", "D. 経済の歪みと不安定性", "E. 正当な民間部門の強化"],
  answer:[0,1,3], multi:true,
  explanation:"MLの経済的・社会的影響：金融機関の脆弱化、犯罪と汚職の増加、税収減（増加ではない）、経済の歪みと不安定性、正当な民間部門の弱体化（強化ではない）。また国の風評リスク、対外投資への減衰効果なども含まれる。"
},
{
  id:"1a-08", topic:"意図的な無関心", difficulty:"応用",
  question:"意図的な無関心（Willful Blindness）について正しく述べているのはどれですか？",
  options:["A. 実際の知識の証明が必要なため、法的責任には問えない", "B. 「事実を知ることの恣意的な回避」であり、実際の知識があったことと同等に扱われる", "C. 意図的な無関心はMLには適用されるが、テロ資金供与には適用されない", "D. 意図的な無関心は民事上の責任のみを生じさせ、刑事上の責任は生じない"],
  answer:1, explanation:"意図的な無関心（willful blindness）は「事実を知ることの恣意的な回避」と定義され、実際に知っていたことに相当するとされる。FATFはこの定義をテロ資金供与にも拡大した。"
},
{
  id:"1a-09", topic:"個人の説明責任", difficulty:"応用",
  question:"FinCENが2014年に発表したコンプライアンス文化に関する勧告の背景として最も適切なものはどれですか？",
  options:["A. 多くの金融機関でAML/CFTコンプライアンスに取締役会や経営陣の役割を含む不備があることを発見したため", "B. テロリストによる資金調達方法が複雑化したため", "C. EU指令の改正に対応するため", "D. FATF40の勧告が改訂されたため"],
  answer:0, explanation:"FinCENが2014年8月に勧告を発表した背景は、非常に多くの金融機関でAML/CFTコンプライアンスに取締役会や経営陣の役割を含む不備があることを発見したため。この勧告はコンプライアンス文化の強化を求めた。"
},

// ══════════════════════════════════════════════
// CHAPTER 1-B: 銀行・コルレス・PTA・集中口座
// ══════════════════════════════════════════════
{
  id:"1b-01", topic:"コルレス・バンキング", difficulty:"基本",
  question:"コルレス・バンキングにおける「ネスティング」リスクとは何ですか？",
  options:["A. コルレス先銀行が偽造書類を使って取引を行うリスク", "B. コルレス先銀行がさらに別の外国銀行（コルレス先の顧客）にコルレス口座へのアクセスを許可するリスク", "C. コルレス銀行が複数の口座を一つに統合するリスク", "D. コルレス先銀行が監督当局に報告義務を怠るリスク"],
  answer:1, explanation:"ネスティングとは、コルレス先銀行が自行の顧客（外国の金融機関）に対してコルレス口座へのアクセスを許可することで、コルレス銀行が最終的な顧客を特定できなくなるリスク。これにより高リスク顧客が間接的にコルレス口座を使用できる。"
},
{
  id:"1b-02", topic:"コルレス・バンキング", difficulty:"応用",
  question:"コルレス・バンキングに関するFATF勧告13の要件として正しいものはどれですか？（3つ選択）",
  options:["A. コルレス先銀行について十分な情報を収集し業務内容を把握する", "B. コルレス先機関のAML/CFTのプログラムと統制を評価する", "C. コルレス先銀行の全顧客に直接CDDを実施する", "D. 新たなコルレス取引を開始する前に上級管理職の承認を得る", "E. シェル・バンクのコルレス口座は禁止する"],
  answer:[0,1,3], multi:true,
  explanation:"FATF勧告13：①コルレス先銀行の業務内容把握②コルレス先のAML/CFTプログラムと統制の評価③新規コルレス取引開始前の上級管理職承認④PTAの利用者にCDDが行われていることの確認⑤シェルバンクのコルレス口座は禁止。コルレス先の全顧客に直接CDDを行うことは要件ではない。"
},
{
  id:"1b-03", topic:"ペイヤブル・スルー口座", difficulty:"応用",
  question:"ペイヤブル・スルー口座（PTA）が通常のコルレス口座と異なる最大の特徴はどれですか？",
  options:["A. PTAは複数の外国金融機関が共同で保有できる", "B. PTAでは外国金融機関の顧客が、コルレス銀行の資金を直接管理・アクセスできる", "C. PTAは米国の銀行のみが開設できる", "D. PTAでは資金の電信送金が禁止されている"],
  answer:1, explanation:"PTAの最大の特徴は、外国金融機関の顧客（最終利用者）がコルレス銀行の口座資金を直接管理できること。通常のコルレス関係では、コルレス先銀行が顧客から注文を受けてコルレス銀行に伝える。このため外国金融機関の顧客に対するCDDが困難になる。"
},
{
  id:"1b-04", topic:"集中口座", difficulty:"基本",
  question:"集中口座（オムニバス口座）に関する記述として正しいものはどれですか？",
  options:["A. 顧客の氏名で個別に保有される", "B. 金融機関自身の名義で保有され、顧客識別情報が取引から分離されるとMLリスクが生じる", "C. 専ら外部の企業間決済のみに使用される", "D. FATF勧告10で使用が禁止されている"],
  answer:1, explanation:"集中口座（オムニバス口座）は金融機関自身の名義で保有され、主に内部管理や銀行間取引に使用される。顧客識別情報（氏名・取引金額・口座番号）が金融取引から分離され監査証跡が失われると、資金の出所が不明確になりMLリスクが発生する。"
},
{
  id:"1b-05", topic:"プライベート・バンキング", difficulty:"応用",
  question:"プライベート・バンキングがMLに脆弱な要因として、スタディガイドが挙げているものはどれですか？（3つ選択）",
  options:["A. 強力な顧客による圧力", "B. 秘密と裁量の文化", "C. 完全なデジタル取引のみで行われる", "D. 民間投資会社（PIC）の利用", "E. 腐敗した重要な公的地位を有する者（PEP）"],
  answer:[0,1,4], multi:true,
  explanation:"プライベートバンキングのMLリスク要因：顧客擁護、権力のある顧客、秘密と裁量の文化、機密法域、AML管理が緩い文化、腐敗したPEP、PIC（民間投資会社）の利用、多数の法域に資産を保有、相続時の財産分割用口座など。デジタル取引のみというのは誤り。"
},
{
  id:"1b-06", topic:"PIC・シェルカンパニー", difficulty:"応用",
  question:"プライベート・バンキングにおけるプライベート投資法人（PIC）の主な目的はどれですか？",
  options:["A. 高リスク投資商品への投資収益を最大化するため", "B. 秘密保持ヘイブンで設立し、クライアントの機密性を維持し資産を保有するため", "C. 複数の口座を一元管理して送金コストを削減するため", "D. 税務申告を効率化するための合法的な節税対策"],
  answer:1, explanation:"PIC（プライベート投資法人）はオフショア法域にある個々の銀行顧客などにより、資産を保有する目的で設立された法人。機密性の維持と税関連・信託関連業務のために設立されるシェルカンパニーであり、最終受益者を偽装するためにMLに利用されるリスクがある。"
},

// ══════════════════════════════════════════════
// CHAPTER 1-C: PEP・ストラクチャリング
// ══════════════════════════════════════════════
{
  id:"1c-01", topic:"PEP", difficulty:"基本",

const STORE_KEY = 'cams_v1';

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { correct:0, incorrect:0, byTopic:{}, answered:{}, examHistory:[], streak:0, lastDate:null };
}
function saveStore(st) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch(e) {}
}

let ST = loadStore();

function recordAnswer(qId, topic, ok) {
  ST.correct += ok ? 1 : 0;
  ST.incorrect += ok ? 0 : 1;
  if (!ST.byTopic[topic]) ST.byTopic[topic] = {correct:0, incorrect:0};
  ST.byTopic[topic][ok ? 'correct' : 'incorrect']++;
  if (!ST.answered[qId]) ST.answered[qId] = {correct:0, incorrect:0, count:0, lastAt:0};
  ST.answered[qId].correct += ok ? 1 : 0;
  ST.answered[qId].incorrect += ok ? 0 : 1;
  ST.answered[qId].count++;
  ST.answered[qId].lastAt = Date.now();
  if (!ok) ST.answered[qId].lastWrong = Date.now();
  const today = new Date().toDateString();
  if (ST.lastDate !== today) { ST.streak = (ST.streak||0)+1; ST.lastDate = today; }
  saveStore(ST);
  updateHeader();
}

function recordExam(score, total) {
  const p = Math.round(score/total*100);
  if (!ST.examHistory) ST.examHistory = [];
  ST.examHistory.unshift({date: new Date().toLocaleString('ja-JP'), score, total, pct:p});
  if (ST.examHistory.length > 20) ST.examHistory = ST.examHistory.slice(0,20);
  saveStore(ST);
}

function updateHeader() {
  const tot = ST.correct + ST.incorrect;
  const p = tot === 0 ? 0 : Math.round(ST.correct/tot*100);
  document.getElementById('hdr-correct').textContent = ST.correct;
  document.getElementById('hdr-wrong').textContent = ST.incorrect;
  document.getElementById('hdr-pct').textContent = p + '%';
}

// HELPERS
// ═══════════════════════════════════════
function shuffle(arr) { return [...arr].sort(() => Math.random() - .5); }

function isCorrect(q, ans) {
  if (q.multi) {
    const cs = Array.isArray(q.answer) ? q.answer : [q.answer];
    if (!Array.isArray(ans)) return false;
    return ans.length === cs.length && ans.every(x => cs.includes(x));
  }
  return ans === q.answer;
}

function pct(a, b) { return a+b === 0 ? 0 : Math.round(a/(a+b)*100); }

const DIFFS = ['基本','応用','本番レベル'];

function tag(txt, cls) { return `<span class="tag ${cls}">${txt}</span>`; }

function optClass(i, done, answer, sel) {
  if (!done) return sel.includes(i) ? 'opt selected' : 'opt';
  const cs = Array.isArray(answer) ? answer : [answer];
  if (cs.includes(i)) return 'opt correct';
  if (sel.includes(i)) return 'opt wrong';
  return 'opt';
}

function diffTag(d) {
  if (d==='本番レベル') return tag(d,'tag-pur');
  if (d==='応用') return tag(d,'tag-gold');
  return tag(d,'tag-green');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

const content = () => $('content');
function html(h) { content().innerHTML = h; content().scrollTop = 0; }

  for (const [ch, topics] of Object.entries(CHAPTERS)) {

// PRACTICE  (①項目選択 ②ランダム ③復習)
// ═══════════════════════════════════════
let PR = {
  pool:[], idx:0, sel:[], done:false,
  mode:'select',      // 'select' | 'random' | 'review'
  // select mode
  selChapter:'',      // '' = 未選択
  selTopics:[],       // 選択中のトピックリスト
  selDiff:'全て',
  // random sub-mode
  randMode:'weak',    // 'weak' | 'random' | 'fresh'
  // review sub-mode
  revMode:'wrong',    // 'wrong' | 'oldest'
};

/* ---- プール構築 ---- */
function buildPool() {
  let q = QUESTION_BANK;

  if (PR.mode === 'select') {
    if (PR.selTopics.length > 0) q = q.filter(x => PR.selTopics.includes(x.topic));
    if (PR.selDiff !== '全て') q = q.filter(x => x.difficulty === PR.selDiff);
    // weak-first
    const fresh  = q.filter(x => !ST.answered[x.id]);
    const weak   = q.filter(x => ST.answered[x.id] && pct(ST.answered[x.id].correct, ST.answered[x.id].incorrect) < 60)
                    .sort((a,b) => pct(ST.answered[a.id].correct,ST.answered[a.id].incorrect)
                                 - pct(ST.answered[b.id].correct,ST.answered[b.id].incorrect));
    const ok     = q.filter(x => ST.answered[x.id] && pct(ST.answered[x.id].correct, ST.answered[x.id].incorrect) >= 60);
    return [...shuffle(fresh), ...weak, ...shuffle(ok)];
  }

  if (PR.mode === 'random') {
    if (PR.randMode === 'weak') {
      const answered = q.filter(x => ST.answered[x.id]);
      const fresh    = q.filter(x => !ST.answered[x.id]);
      const weak     = answered.filter(x => pct(ST.answered[x.id].correct, ST.answered[x.id].incorrect) < 60)
                        .sort((a,b) => pct(ST.answered[a.id].correct,ST.answered[a.id].incorrect)
                                     - pct(ST.answered[b.id].correct,ST.answered[b.id].incorrect));
      const ok       = answered.filter(x => pct(ST.answered[x.id].correct, ST.answered[x.id].incorrect) >= 60);
      return [...weak, ...shuffle(fresh), ...shuffle(ok)];
    }
    if (PR.randMode === 'random') return shuffle(q);
    if (PR.randMode === 'fresh') {
      const fresh = q.filter(x => !ST.answered[x.id]);
      const rest  = q.filter(x =>  ST.answered[x.id]);
      return [...shuffle(fresh), ...shuffle(rest)];
    }
  }

  if (PR.mode === 'review') {
    const answered = q.filter(x => ST.answered[x.id]);
    if (PR.revMode === 'wrong') {
      // 間違えた問題（lastWrong あり）を正解率低い順
      const wrong = answered.filter(x => ST.answered[x.id].lastWrong)
                    .sort((a,b) => pct(ST.answered[a.id].correct,ST.answered[a.id].incorrect)
                                 - pct(ST.answered[b.id].correct,ST.answered[b.id].incorrect));
      return wrong.length ? wrong : [];
    }
    if (PR.revMode === 'oldest') {
      // 回答日が古い順
      return [...answered].sort((a,b) => (ST.answered[a.id].lastAt||0) - (ST.answered[b.id].lastAt||0));
    }
  }
  return shuffle(q);
}

/* ---- メイン描画 ---- */
function renderPractice() {
  // モード選択画面
  if (!PR.pool.length || currentPracticeNeedsRebuild()) {
    PR._lastState = JSON.stringify({mode:PR.mode,selTopics:PR.selTopics,selDiff:PR.selDiff,randMode:PR.randMode,revMode:PR.revMode});
    PR.pool = buildPool(); PR.idx = 0; PR.sel = []; PR.done = false;
  }
  if (!PR.pool.length) {
    html(`<div style="text-align:center;padding:40px;color:#64748B">
      <div style="font-size:32px;margin-bottom:12px">📭</div>

      <button class="btn-primary" onclick="prShowModeMenu()">モードを選択</button>

    return;
  }
  const q = PR.pool[PR.idx];
  const isMulti = !!q.multi;
  const cs = Array.isArray(q.answer) ? q.answer : [q.answer];
  const ok = PR.done && isCorrect(q, q.multi ? PR.sel : PR.sel[0]);
  const qInfo = ST.answered[q.id];
  const qPct  = qInfo ? pct(qInfo.correct, qInfo.incorrect) : null;

  const optsHtml = q.options.map((opt, i) => {
    const cls = optClass(i, PR.done, q.answer, PR.sel);
    return `<button class="${cls}" onclick="prOpt(${i})">${opt}</button>`;
  }).join('');

  const modeLabel = PR.mode==='select'
    ? (PR.selTopics.length ? PR.selTopics.slice(0,2).join('・')+(PR.selTopics.length>2?'…':'') : '全トピック')
    : PR.mode==='random' ? {'weak':'苦手優先','random':'完全ランダム','fresh':'未実施優先'}[PR.randMode]
    : {'wrong':'間違い問題','oldest':'古い順'}[PR.revMode];

  const explHtml = PR.done ? `
    <div class="card ${ok?'accent':'danger'}" style="margin-top:10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">

        ${!ok?`<span style="font-size:11px;color:#64748B">正解: ${cs.map(c=>String.fromCharCode(65+c)).join('・')}</span>`:''}
      </div>

  ` : `<button class="btn-primary" style="margin-top:12px;opacity:${PR.sel.length?1:.5}" onclick="prSubmit()" ${PR.sel.length?'':' disabled'}>回答する</button>`;

  html(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2>🎯 一問一答</h2>
      <button class="btn-sec" onclick="prShowModeMenu()" style="padding:5px 10px;font-size:11px">⚙ モード</button>
    </div>

    <div style="background:#0D1520;border:1px solid #162035;border-radius:10px;padding:8px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:11px;color:#64748B">${modeLabel} | ${PR.idx+1}/${PR.pool.length}問</span>
      <div style="display:flex;gap:6px">
        <span style="font-size:11px;color:#64748B">${qInfo?`正解率${qPct}%`:'初回'}</span>
        <button class="btn-sec" onclick="prNext()" style="padding:3px 8px;font-size:10px">スキップ</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">
        ${tag(q.topic,'tag-blue')} ${diffTag(q.difficulty)} ${isMulti?tag('複数選択','tag-pur'):''}
      </div>
      <p style="font-size:14px;line-height:1.8;font-weight:600">${q.question}</p>
    </div>
    <div>${optsHtml}</div>
    ${explHtml}
  `);
}

function currentPracticeNeedsRebuild() {
  const cur = JSON.stringify({mode:PR.mode,selTopics:PR.selTopics,selDiff:PR.selDiff,randMode:PR.randMode,revMode:PR.revMode});
  return cur !== (PR._lastState||'');
}

function prSelectChapter(ch) {
  PR.selChapter = ch;
  PR.selTopics = [...CHAPTERS[ch]]; // 章選択時は全トピック選択
  prShowChapterSelect();
}

function prToggleTopic(t) {
  PR.selTopics = PR.selTopics.includes(t)
    ? PR.selTopics.filter(x=>x!==t)
    : [...PR.selTopics, t];
  prShowChapterSelect();
}

function prSelectAllTopics() {
  PR.selTopics = [...(CHAPTERS[PR.selChapter]||[])];
  prShowChapterSelect();
}

function prClearTopics() {
  PR.selTopics = [];
  prShowChapterSelect();
}

function prSetDiff(d) { PR.selDiff = d; prShowChapterSelect(); }

function prStartSelect() {
  PR.mode = 'select';
  PR._lastState = '';
  PR.pool = buildPool(); PR.idx = 0; PR.sel = []; PR.done = false;
  renderPractice();
}

function setRandMode(m) {
  PR.mode = 'random'; PR.randMode = m;
  PR._lastState = '';
  PR.pool = buildPool(); PR.idx = 0; PR.sel = []; PR.done = false;
  renderPractice();
}

function setRevMode(m) {
  PR.mode = 'review'; PR.revMode = m;
  PR._lastState = '';
  PR.pool = buildPool(); PR.idx = 0; PR.sel = []; PR.done = false;
  renderPractice();
}

function prOpt(i) {
  if (PR.done) return;
  const q = PR.pool[PR.idx];
  if (q.multi) { PR.sel = PR.sel.includes(i) ? PR.sel.filter(x=>x!==i) : [...PR.sel, i]; }
  else { PR.sel = [i]; }
  renderPractice();
}

function prSubmit() {
  if (!PR.sel.length) return;
  PR.done = true;
  const q = PR.pool[PR.idx];
  const ok = isCorrect(q, q.multi ? PR.sel : PR.sel[0]);
  recordAnswer(q.id, q.topic, ok);
  renderPractice();
}

function prNext() {
  PR.idx = (PR.idx + 1) % PR.pool.length;
  PR.sel = []; PR.done = false;
  renderPractice();
}

function setEC(n) { EX.count = n; renderExamSetup(); }
function setED(d) { EX.diff = d; renderExamSetup(); }

function startExam() {
  let pool = QUESTION_BANK;
  if (EX.diff !== '全て') pool = pool.filter(q => q.difficulty === EX.diff);
  EX.questions = shuffle(pool).slice(0, Math.min(EX.count, pool.length));
  EX.answers = {}; EX.cur = 0; EX.timeLeft = EX.questions.length * 90;
  EX.selS = -1; EX.selM = []; EX.phase = 'running';
  if (examTimer) clearInterval(examTimer);
  examTimer = setInterval(() => {
    EX.timeLeft--;
    if (EX.timeLeft <= 0) { clearInterval(examTimer); examTimer = null; finishExam(); }
    else renderExamQ();
  }, 1000);
  renderExamQ();
}

function renderExamQ() {
  if (EX.phase !== 'running') return;
  const q = EX.questions[EX.cur];
  const isMulti = !!q.multi;
  const submitted = EX.answers[EX.cur] !== undefined;
  const cs = Array.isArray(q.answer) ? q.answer : [q.answer];
  const curSel = isMulti ? EX.selM : (EX.selS >= 0 ? [EX.selS] : []);
  const mm = String(Math.floor(EX.timeLeft/60)).padStart(2,'0');
  const ss = String(EX.timeLeft%60).padStart(2,'0');
  const urgent = EX.timeLeft < 60;
  const optsHtml = q.options.map((opt, i) => {
    let cls = 'opt';
    if (!submitted) { if (curSel.includes(i)) cls = 'opt selected'; }
    else { if (cs.includes(i)) cls = 'opt correct'; else if (curSel.includes(i)) cls = 'opt wrong'; }
    return `<button class="${cls}" onclick="exOpt(${i})">${opt}</button>`;
  }).join('');
  const ok = submitted && isCorrect(q, isMulti ? EX.selM : EX.selS);
  let bottomHtml = '';
  if (!submitted) {
    const canSubmit = isMulti ? EX.selM.length > 0 : EX.selS >= 0;
    bottomHtml = `<button class="btn-primary" style="opacity:${canSubmit?1:.5}" onclick="exSubmit()" ${canSubmit?'':' disabled'}>回答する</button>`;
  } else {
    bottomHtml = `<div class="card ${ok?'accent':'danger'}" style="margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span>${ok?'✅':'❌'}</span>
        <span style="font-weight:700;color:${ok?'#00C9A7':'#F43F5E'}">${ok?'正解':'不正解'}</span>
        ${!ok?`<span style="font-size:11px;color:#64748B">正解: ${cs.map(c=>String.fromCharCode(65+c)).join('・')}</span>`:''}
      </div>
      <p style="font-size:12px;line-height:1.8">${q.explanation}</p>
    </div>`;
    bottomHtml += EX.cur < EX.questions.length-1
      ? `<button class="btn-primary" onclick="exNext()">次の問題 →</button>`
      : `<button class="btn-primary" style="background:linear-gradient(135deg,#F59E0B,#d4890a)" onclick="finishExam()">結果を見る 🏆</button>`;
  }
  content().innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 style="font-size:15px">問題 ${EX.cur+1}/${EX.questions.length}</h2>
      <div class="timer ${urgent?'urgent':''}" style="color:${urgent?'#F43F5E':'#F59E0B'}">⏱ ${mm}:${ss}</div>
    </div>
    <div class="pbar" style="margin-bottom:12px"><div class="pbar-fill" style="width:${(EX.cur+1)/EX.questions.length*100}%;background:#3B82F6"></div></div>
    <div class="card">
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">
        ${tag(q.topic,'tag-blue')} ${diffTag(q.difficulty)} ${isMulti?tag('複数選択','tag-pur'):''}
      </div>
      <p style="font-size:14px;line-height:1.8;font-weight:600">${q.question}</p>
    </div>
    <div>${optsHtml}</div>
    <div style="margin-top:10px">${bottomHtml}</div>
  `;
}

function exOpt(i) {
  if (EX.answers[EX.cur] !== undefined) return;
  const q = EX.questions[EX.cur];
  if (q.multi) { EX.selM = EX.selM.includes(i) ? EX.selM.filter(x=>x!==i) : [...EX.selM,i]; }
  else { EX.selS = i; }
  renderExamQ();
}

function exSubmit() {
  const q = EX.questions[EX.cur];
  const ans = q.multi ? EX.selM : EX.selS;
  if (q.multi ? ans.length===0 : ans<0) return;
  EX.answers[EX.cur] = ans;
  renderExamQ();
}

function exNext() { EX.cur++; EX.selS = -1; EX.selM = []; renderExamQ(); }

function finishExam() {
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
  EX.phase = 'done';
  const score = EX.questions.filter((q,i) => isCorrect(q, EX.answers[i] ?? (q.multi?[]:-1))).length;
  const total = EX.questions.length;
  const p = Math.round(score/total*100);
  recordExam(score, total);
  EX.questions.forEach((q,i) => {
    const ans = EX.answers[i] ?? (q.multi?[]:-1);
    recordAnswer(q.id, q.topic, isCorrect(q, ans));
  });
  const rows = EX.questions.map((q,i) => {
    const ans = EX.answers[i] ?? (q.multi?[]:-1);
    const ok = isCorrect(q, ans);
    const cs = Array.isArray(q.answer)?q.answer:[q.answer];
    return `<div class="card ${ok?'accent':'danger'}" style="padding:10px 12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span style="font-size:10px;color:#64748B">Q${i+1} · ${q.topic}</span>
        <span style="font-size:10px;font-weight:700;color:${ok?'#00C9A7':'#F43F5E'}">${ok?'✅ 正解':'❌ 不正解'}</span>
      </div>
      <p style="font-size:12px;margin-bottom:${ok?0:5}px">${q.question}</p>
      ${!ok?`<p style="font-size:11px;color:#64748B;line-height:1.6">正解: ${cs.map(c=>String.fromCharCode(65+c)).join('・')}<br>${q.explanation.slice(0,100)}…</p>`:''}
    </div>`;
  }).join('');
  content().innerHTML = `
    <h2 style="margin-bottom:14px">📋 結果</h2>
    <div class="card" style="text-align:center;padding:24px;margin-bottom:14px">
      <div style="font-size:52px;font-weight:900;color:${p>=75?'#00C9A7':'#F43F5E'}">${p}%</div>
      <div style="color:#64748B;font-size:13px">${total}問中 ${score}問正解</div>
      <div class="pbar" style="margin:12px 0"><div class="pbar-fill" style="width:${p}%;background:${p>=75?'#00C9A7':'#F43F5E'}"></div></div>
      <div style="font-size:12px;color:#64748B">${p>=75?'🎉 合格ライン達成！':'📚 もう一度挑戦しよう（目標75%）'}</div>
    </div>
    <div>${rows}</div>
    <button class="btn-primary" style="margin-top:12px" onclick="renderExamSetup()">再挑戦 →</button>
  `;
}

// ═══════════════════════════════════════
// TOPICS (大項目4章 → 小トピック)
// ═══════════════════════════════════════
let TPC = { chapter:null, topic:null, pool:[], idx:0, sel:[], done:false };

function renderTopicsHome() {
  TPC.chapter = null; TPC.topic = null;
  const chCards = Object.entries(CHAPTERS).map(([ch, topics]) => {
    const total = QUESTION_BANK.filter(q => topics.includes(q.topic)).length;
    const answered = QUESTION_BANK.filter(q => topics.includes(q.topic) && ST.answered[q.id]).length;
    const info = topics.reduce((acc,t)=>{
      const d=ST.byTopic[t]; if(d){acc.c+=d.correct;acc.i+=d.incorrect;} return acc;
    },{c:0,i:0});
    const p = pct(info.c, info.i);
    const pColor = info.c+info.i===0?'#64748B':p>=75?'#00C9A7':'#F43F5E';
    return `<div class="card" style="cursor:pointer;margin-bottom:8px" onclick="renderChapterTopics('${ch.replace(/'/g,"\\'")}')">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-weight:700;font-size:14px">${ch}</div>
          <div style="font-size:10px;color:#64748B;margin-top:3px">${topics.length}トピック・${total}問 | ${answered}問回答済み</div>
          ${info.c+info.i>0?`<div class="pbar" style="margin-top:6px;width:120px"><div class="pbar-fill" style="width:${p}%;background:${pColor}"></div></div>`:''}
        </div>
        <span style="font-size:${info.c+info.i>0?'18':'13'}px;font-weight:800;color:${pColor}">${info.c+info.i>0?p+'%':'→'}</span>
      </div>
    </div>`;
  }).join('');
  html(`
    <div class="sec-title">📚 トピック別練習</div>
    <div class="sec-sub">スタディガイドの4章構成で学習</div>
    ${chCards}
  `);
}

function renderChapterTopics(ch) {
  TPC.chapter = ch;
  const topics = CHAPTERS[ch] || [];
  const rows = topics.map(t => {
    const qs = QUESTION_BANK.filter(q => q.topic === t);
    if (!qs.length) return '';
    const answered = qs.filter(q => ST.answered[q.id]).length;
    const info = ST.byTopic[t];
    const p = info ? pct(info.correct, info.incorrect) : null;
    return `<button onclick="startTopicPractice('${t.replace(/'/g,"\\'")}') "
      style="display:flex;justify-content:space-between;align-items:center;width:100%;background:#0D1520;border:1px solid #162035;color:#E2E8F4;border-radius:10px;padding:11px 13px;font-size:13px;cursor:pointer;text-align:left;font-family:inherit;margin-bottom:5px">
      <div>
        <div style="font-weight:600">${t}</div>
        <div style="font-size:10px;color:#64748B;margin-top:2px">${qs.length}問・${answered}問回答済み</div>
      </div>
      ${p!==null?`<span style="font-size:13px;font-weight:800;color:${p>=75?'#00C9A7':'#F43F5E'}">${p}%</span>`:'<span style="font-size:10px;color:#64748B">未回答</span>'}
    </button>`;
  }).join('');
  html(`
    <button class="btn-sec" onclick="renderTopicsHome()" style="margin-bottom:12px">← 章一覧に戻る</button>
    <h2 style="margin-bottom:4px;font-size:16px">${ch}</h2>
    <div style="font-size:11px;color:#64748B;margin-bottom:14px">トピックを選んで練習</div>
    ${rows}
  `);
}

function startTopicPractice(t) {
  TPC.topic = t;
  const qs = QUESTION_BANK.filter(q => q.topic === t);
  const weak  = qs.filter(q => ST.answered[q.id] && pct(ST.answered[q.id].correct, ST.answered[q.id].incorrect) < 60)
                  .sort((a,b) => pct(ST.answered[a.id].correct,ST.answered[a.id].incorrect) - pct(ST.answered[b.id].correct,ST.answered[b.id].incorrect));
  const fresh = qs.filter(q => !ST.answered[q.id]);
  const ok2   = qs.filter(q => ST.answered[q.id] && pct(ST.answered[q.id].correct,ST.answered[q.id].incorrect) >= 60);
  TPC.pool = [...shuffle(fresh), ...weak, ...shuffle(ok2)];
  TPC.idx = 0; TPC.sel = []; TPC.done = false;
  renderTopicQ();
}

function renderTopicQ() {
  if (!TPC.pool.length) { renderChapterTopics(TPC.chapter); return; }
  const q = TPC.pool[TPC.idx];
  const isMulti = !!q.multi;
  const cs = Array.isArray(q.answer) ? q.answer : [q.answer];
  const ok = TPC.done && isCorrect(q, isMulti ? TPC.sel : TPC.sel[0] ?? -1);
  const optsHtml = q.options.map((opt, i) => {
    const cls = optClass(i, TPC.done, q.answer, TPC.sel);
    return `<button class="${cls}" onclick="tpcOpt(${i})">${opt}</button>`;
  }).join('');
  const bottom = TPC.done ? `
    <div class="card ${ok?'accent':'danger'}" style="margin-top:10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span>${ok?'✅':'❌'}</span>
        <span style="font-weight:700;color:${ok?'#00C9A7':'#F43F5E'}">${ok?'正解！':'不正解'}</span>
        ${!ok?`<span style="font-size:11px;color:#64748B">正解: ${cs.map(c=>String.fromCharCode(65+c)).join('・')}</span>`:''}
      </div>
      <p style="font-size:13px;line-height:1.8">${q.explanation}</p>
    </div>
    <button class="btn-primary" style="margin-top:12px" onclick="tpcNext()">次の問題へ →</button>
  ` : `<button class="btn-primary" style="margin-top:12px;opacity:${TPC.sel.length?1:.5}" onclick="tpcSubmit()" ${TPC.sel.length?'':' disabled'}>回答する</button>`;
  content().innerHTML = `
    <button class="btn-sec" onclick="renderChapterTopics('${TPC.chapter.replace(/'/g,"\\'")}') " style="margin-bottom:12px">← トピック一覧に戻る</button>
    <div style="font-size:14px;font-weight:800;margin-bottom:4px">${TPC.topic}</div>
    <div style="font-size:11px;color:#64748B;margin-bottom:12px">${TPC.idx+1}/${TPC.pool.length}問</div>
    <div class="card">
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">
        ${tag(q.topic,'tag-blue')} ${diffTag(q.difficulty)} ${isMulti?tag('複数選択','tag-pur'):''}
      </div>
      <p style="font-size:14px;line-height:1.8;font-weight:600">${q.question}</p>
    </div>
    <div>${optsHtml}</div>
    ${bottom}
  `;
}

function tpcOpt(i) {
  if (TPC.done) return;
  const q = TPC.pool[TPC.idx];
  if (q.multi) { TPC.sel = TPC.sel.includes(i) ? TPC.sel.filter(x=>x!==i) : [...TPC.sel,i]; }
  else { TPC.sel = [i]; }
  renderTopicQ();
}

function tpcSubmit() {
  if (!TPC.sel.length) return;
  TPC.done = true;
  const q = TPC.pool[TPC.idx];
  const ans = q.multi ? TPC.sel : TPC.sel[0];
  recordAnswer(q.id, q.topic, isCorrect(q, ans));
  renderTopicQ();
}

function tpcNext() {
  TPC.idx = (TPC.idx+1) % TPC.pool.length;
  TPC.sel = []; TPC.done = false;
  renderTopicQ();
}

// ═══════════════════════════════════════
// STATS
// ═══════════════════════════════════════
function renderStats() {
  const tot = ST.correct + ST.incorrect;
  const p = pct(ST.correct, ST.incorrect);
  const totalAnswered = Object.keys(ST.answered).length;
  const masteredQ = Object.entries(ST.answered).filter(([,v]) => pct(v.correct,v.incorrect) >= 80 && v.count >= 2).length;
  const weakQ = Object.entries(ST.answered).filter(([,v]) => pct(v.correct,v.incorrect) < 60).length;

  // 章別成績
  const chRows = Object.entries(CHAPTERS).map(([ch, topics]) => {
    const info = topics.reduce((acc,t)=>{ const d=ST.byTopic[t]; if(d){acc.c+=d.correct;acc.i+=d.incorrect;} return acc; },{c:0,i:0});
    const cp = pct(info.c, info.i);
    const total = QUESTION_BANK.filter(q => topics.includes(q.topic)).length;
    const answered = QUESTION_BANK.filter(q => topics.includes(q.topic) && ST.answered[q.id]).length;
    if (info.c+info.i===0) return '';
    return `<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:3px">
        <span style="font-size:11px;color:#64748B">${ch.replace('CH1: ','').replace('CH2: ','').replace('CH3: ','').replace('CH4: ','')}</span>
        <span style="font-size:11px;font-weight:700;color:${cp>=75?'#00C9A7':'#F43F5E'}">${cp}% (${answered}/${total}問)</span>
      </div>
      <div class="pbar"><div class="pbar-fill" style="width:${cp}%;background:${cp>=75?'#00C9A7':'#F43F5E'}"></div></div>
    </div>`;
  }).join('');

  const hist = (ST.examHistory||[]).map(h =>
    `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #162035">
      <span style="font-size:11px;color:#64748B">${h.date}</span>
      <span style="font-size:12px;font-weight:700;color:${h.pct>=75?'#00C9A7':'#F43F5E'}">${h.score}/${h.total}問 ${h.pct}%</span>
    </div>`
  ).join('');

  content().innerHTML = `
    <h2 style="margin-bottom:14px">📊 成績統計</h2>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-val" style="color:#00C9A7">${ST.correct}</div><div class="stat-lbl">正解数</div></div>
      <div class="stat-box"><div class="stat-val" style="color:#F43F5E">${ST.incorrect}</div><div class="stat-lbl">不正解数</div></div>
      <div class="stat-box"><div class="stat-val" style="color:#F59E0B">${p}%</div><div class="stat-lbl">正解率</div></div>
    </div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-val" style="color:#3B82F6;font-size:22px">${totalAnswered}</div><div class="stat-lbl">問回答済み</div></div>
      <div class="stat-box"><div class="stat-val" style="color:#00C9A7;font-size:22px">${masteredQ}</div><div class="stat-lbl">問マスター</div></div>
      <div class="stat-box"><div class="stat-val" style="color:#F43F5E;font-size:22px">${weakQ}</div><div class="stat-lbl">問苦手</div></div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div style="font-weight:700;font-size:13px;margin-bottom:8px">全体の正解率（目標75%）</div>
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span style="font-size:11px;color:#64748B">${tot}問回答・全${QUESTION_BANK.length}問</span>
        <span style="font-weight:700;color:#00C9A7">${p}%</span>
      </div>
      <div class="pbar"><div class="pbar-fill" style="width:${p}%;background:linear-gradient(90deg,#00C9A7,#3B82F6)"></div></div>
      <div style="font-size:10px;color:#64748B;margin-top:6px">🔥 連続学習: ${ST.streak||0}日</div>
    </div>
    ${chRows ? `<div class="card" style="margin-bottom:12px"><div style="font-weight:700;font-size:13px;margin-bottom:12px">章別成績</div>${chRows}</div>` : ''}
    ${hist ? `<div class="card" style="margin-bottom:12px"><div style="font-weight:700;font-size:13px;margin-bottom:8px">📅 模擬試験の履歴</div>${hist}</div>` : ''}
    <button class="btn-sec" style="width:100%;margin-top:4px" onclick="resetConfirm()">⚠ データをリセット</button>
  `;
}

function resetConfirm() {
  if (confirm('全ての学習データをリセットしますか？\n（問題データは消えません）')) {
    ST = { correct:0, incorrect:0, byTopic:{}, answered:{}, examHistory:[], streak:0, lastDate:null };
    saveStore(ST); updateHeader(); toast('データをリセットしました'); renderStats();
  }
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
updateHeader();
prShowModeMenu();
</script>
